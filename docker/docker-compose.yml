version: "3.9"

services:
  nexus:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nexus-ai-governance:latest
    container_name: nexus-governance
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - VECTOR_STORE_BACKEND=memory
    volumes:
      - nexus-data:/app/data
      - nexus-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nexus
    restart: unless-stopped

volumes:
  nexus-data:
  nexus-logs:
